export default "\n\n\n<!--  <ion-row>\n  <ion-col>\n    <ion-button style=\"text-align: center;\" (click)=\"btnclick()\">\n      Change Password<br/>\n    </ion-button>\n  </ion-col>\n  <ion-col>\n    <ion-button style=\"text-align: center;\" (click)=\"logout()\">\n      Logout<br/>\n    </ion-button>\n  </ion-col>\n</ion-row> -->\n  <!-- <ion-button shape=\"round\" size=\"default\" expand=\"block\" (click)=\"logout()\" class=\"btn btn-sm\" color=\"danger\" fill=\"outline\">Logout</ion-button> -->\n<h2>Party details</h2>\n <ion-item>\n   <ion-list>\n    <ion-grid class=\"padding\" >\n      <ion-row>\n    <ion-col size=\"1\">Sl.no</ion-col>\n    <ion-col size=\"3\">Abbreviation</ion-col>\n        <ion-col size=\"4\">Party Name</ion-col>\n        <ion-col size=\"4\">Add</ion-col>\n       </ion-row>\n      <ion-row *ngFor=\"let d of details; index as m\">\n        <ion-col size=\"1\">{{m+1}}</ion-col>\n        <ion-col size=\"3\">{{d.abbreviation}}</ion-col>\n        <ion-col size=\"4\">{{d.partyname}}</ion-col>\n        <ion-col size=\"4\">\n          <ion-button shape=\"round\" (click)=\"btnClicked(d)\" expand=\"block\" size=\"default\" fill=\"outline\" *ngIf=\"d.actvated=='no'\" >Activate</ion-button>\n        <div *ngIf=\"d.actvated=='yes'\" (click)=\"btnClicked(d)\" >Activated</div>\n        <div *ngIf=\"d.actvated=='process'\" >under processing</div></ion-col>\n      </ion-row>\n      </ion-grid>\n   </ion-list>\n  </ion-item>\n";
