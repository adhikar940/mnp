export default "\n<h3 style=\"color:blue;\"><center>Select the State or Union Territory </center></h3>\n<br>\n<br>\n  <div padding>\n  <ion-segment [(ngModel)]=\"st\">\n    <ion-segment-button value=\"stt\">\n      <b >STATES</b>\n    </ion-segment-button>\n    <ion-segment-button value=\"ut\">\n    <b>  UNION TERRITORIES</b>\n    </ion-segment-button>\n    </ion-segment>\n    <br>\n</div>\n\n<div [ngSwitch]=\"st\">\n  <ion-list *ngSwitchCase=\"'stt'\">\n    <div *ngFor=\"let item of items\">\n    <div *ngIf=\"item.Status=='state'\" >\n  <img (click)=\"btnClicked('lok1',item.id, item.State_name)\" src=\"{{zz}}{{ item.Map }}\" width=\"400\" height=\"200\">\n        <ion-button (click)=\"btnClicked('lok1',item.id, item.State_name)\" >{{ item.State_name }}</ion-button>\n      </div>\n      </div>\n\n      </ion-list>\n</div>\n<div [ngSwitch]=\"st\">\n  <ion-list *ngSwitchCase=\"'ut'\">\n    <div *ngFor=\"let item of items\">\n    <div *ngIf=\"item.Status=='UT'\" >\n        <img (click)=\"btnClicked('lok1',item.id, item.State_name)\"  src=\"{{zz}}{{ item.Map }}\" width=\"400\" height=\"200\">\n      <ion-button (click)=\"btnClicked('lok1',item.id, item.State_name)\" >{{ item.State_name }}</ion-button>\n\n      </div>\n      </div>\n      </ion-list>\n</div>\n";
