export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>statedistrict</ion-title>\n  </ion-toolbar>\n</ion-header>\n<ion-content>\n    <app-partylogout>  </app-partylogout>\n  <ion-list>\n  <ion-label>State</ion-label>\n    <ion-item >\n      <ion-select [(ngModel)]=\"selected\">\n<div *ngFor=\"let item of items\">\n        <ion-select-option value={{item.id}}>{{ item.State_name }}</ion-select-option>\n</div>\n      </ion-select>\n    </ion-item>\n  </ion-list>\n\n\n  <app-statedist1 [state]=\"selected\">  </app-statedist1>\n\n\n</ion-content>\n";
