export default "\n<ion-header>\n  <ion-toolbar>\n    <ion-title>states</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <div padding>\n  <ion-segment [(ngModel)]=\"st\">\n    <ion-segment-button value=\"stt\">\n      STATES\n    </ion-segment-button>\n    <ion-segment-button value=\"ut\">\n      UNION TERRITORIES\n    </ion-segment-button>\n    </ion-segment>\n</div>\n\n<div [ngSwitch]=\"st\">\n  <ion-list *ngSwitchCase=\"'stt'\">\n    <ion-item *ngFor=\"let item of items\">\n    <div *ngIf=\"item.Status=='state'\" >\n  <img (click)=\"btnClicked(item.id)\" src=\"{{zz}}{{ item.Map }}\" width=\"400\" height=\"200\">\n        <ion-button (click)=\"btnClicked(item.id)\">{{ item.State_name }}</ion-button>\n      </div>\n      </ion-item>\n\n      </ion-list>\n</div>\n<div [ngSwitch]=\"st\">\n  <ion-list *ngSwitchCase=\"'ut'\">\n    <div *ngFor=\"let item of items\">\n    <div *ngIf=\"item.Status=='UT'\" >\n        <img (click)=\"btnClicked(item.id)\" src=\"{{zz}}{{ item.Map }}\" width=\"400\" height=\"200\">\n      <ion-button (click)=\"btnClicked(item.id)\">{{ item.State_name }}</ion-button>\n\n      </div>\n      </div>\n      </ion-list>\n</div>\n\n</ion-content>\n";
