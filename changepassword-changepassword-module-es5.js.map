export default "<ion-header>\n  <ion-toolbar>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content><br>\n  <h2 style=\"color:blue;text-align:center\">Change Password</h2>\n  <form #form=\"ngForm\" (ngSubmit)=\"save(old_password,new_password)\">\n  <ion-item style=\"border-radius: 10px;background-color: white;\">\n    <ion-input name=\"old_password\" [(ngModel)]=\"old_password\" [type]=\"isTextFieldType ? 'text':'password'\" #oldpass required placeholder=\"Old Password\"></ion-input>\n    <ion-icon slot=\"start\" style=\"color:orangered\" [name]=\"isTextFieldType ? 'eye-off':'eye'\" (click)=\"togglePasswordFieldType()\"></ion-icon>\n  </ion-item><br>\n  <ion-item style=\"border-radius: 10px;background-color: white;\">\n    \n    <ion-input [type]=\"isTextField ? 'text':'password'\" [(ngModel)]=\"new_password\" name=\"new_password\" #newpass required placeholder=\"New Password\"></ion-input>\n    <ion-icon slot=\"start\" style=\"color: blue;\" [name]=\"isTextField ? 'eye-off':'eye'\" (click)=\"togglePasswordField()\"></ion-icon>\n  </ion-item><br>\n<div style=\"text-align: center;\"><ion-button  id=\"submit\" color=\"success\" type=\"Submit\">Submit</ion-button></div>\n</form>\n</ion-content>\n";
