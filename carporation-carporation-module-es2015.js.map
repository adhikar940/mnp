export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>carporation</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n<h2 style=\"text-align: center;color:blue\"> Corporation States </h2>\n<ion-list>\n  <div *ngFor=\"let corp of corporations\">\n    <ion-button shape=\"round\"   fill=\"outline\" size=\"default\" expand=\"block\" (click)=\"GetSelected(corp)\">\n      {{corp.State_name}}-{{corp.Corporation_Details.length}}\n      \n    </ion-button>\n  </div>\n</ion-list>\n</ion-content>\n";
