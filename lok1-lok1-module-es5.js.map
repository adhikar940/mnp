export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>loksabha</ion-title>\n    <style>\n      * {\n  box-sizing: border-box;\n}\n\n.column {\n  float: left;\n  width: 33%;\n  padding: 20px;\n}\n.c {\n  float: left;\n  width: 25%;\n  padding: 20px;\n}\n\n/* Clearfix (clear floats) */\n.row::after {\n  content: \"\";\n  clear: both;\n  display: table;\n}\n</style>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <div *ngIf=\"k\">\n<h5 style=\"color:blue;text-align: center;\">Loksabha - {{z2}} - {{z.length}}</h5>\n  <ion-grid class=\"padding\"  >\n  <ion-row>\n<ion-col size=\"2.5\">Photo</ion-col>\n    <ion-col size=\"2.5\">MPname</ion-col>\n    <ion-col size=\"2.5\">Constituency</ion-col>\n    <ion-col size=\"2.5\">District</ion-col>\n    <ion-col size=\"2\">Party</ion-col>\n  </ion-row>\n\n  <ion-row *ngFor=\"let i of z  ; index as m\">\n      <ion-col  size=\"2.5\" [routerLink]=\"['/lok2',i.MP_name,z1,i.chldid]\"><img src=\"{{zz}}{{i.photo}}\" alt=\"No Image\" width=\"130\" height=\"130\"> </ion-col>\n   <ion-col size=\"2.5\" [routerLink]=\"['/lok2',i.MP_name,z1,i.chldid]\"><b>{{i.MP_name}}</b></ion-col>\n    <ion-col  size=\"2.5\">{{i.constituency_name}}</ion-col>\n    <ion-col  size=\"2.5\">{{i.Districts}}</ion-col>\n    <ion-col  size=\"2\"> {{i.Party}} </ion-col>\n\n  </ion-row>\n\n</ion-grid>\n</div>\n</ion-content>\n";
