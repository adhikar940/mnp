export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>legislativecouncil2</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2 >Constituency Details</h2>\n  <!-- <div *ngFor=\"let cons of details\">  -->\n\n    <ion-grid class=\"padding\" >\n      <ion-row>\n    <ion-col size=\"1\">Sl.no</ion-col>\n        <ion-col size=\"2.75\">MLCname</ion-col>\n        <ion-col size=\"2.75\">Constituency</ion-col>\n        <ion-col size=\"2.75\">Party</ion-col>\n        <ion-col size=\"2.75\">Elected</ion-col>\n      </ion-row>\n      <ion-row *ngFor=\"let cons of details; index as m\">\n          <ion-col  size=\"1\">{{m+1}}</ion-col>\n        <ion-col size=\"2.75\"  ><b>{{cons.MLC_name}}</b></ion-col>\n        <ion-col  size=\"2.75\">{{cons.constituency_name}}</ion-col>\n        <ion-col  size=\"2.75\">{{cons.party}}</ion-col>\n        <ion-col  size=\"2.75\"> {{cons.elected}} </ion-col>\n      </ion-row>\n    </ion-grid>\n   <!-- </div> -->\n</ion-content>\n";
