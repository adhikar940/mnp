export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>collector</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-item>\n    <ion-list >\n      <div *ngFor=\"let collect of collectorstates\">\n    <ion-button shape=\"round\" expand=\"block\" size=\"default\" fill=\"outline\" (click)=\"btnClicked(collect)\">{{collect.State_name}}</ion-button></div>\n  </ion-list>\n  </ion-item>\n</ion-content>\n";
