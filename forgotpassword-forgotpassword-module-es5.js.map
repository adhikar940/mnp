export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>forgotpassword</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-card style=\"border-radius: 10px;\">\n    <ion-item>\n      <ion-input type=\"email\" id=\"email\" name=\"email\" [(ngModel)]=\"email\" placeholder=\"Enter your email\"></ion-input>\n    </ion-item>\n    </ion-card>\n    <div style=\"text-align: center;\">\n    <ion-button color=\"secondary\" (click)=\"forgot(email)\">Verify</ion-button></div>\n</ion-content>\n";
