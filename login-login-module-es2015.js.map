export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>login</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content padding class=\"background-image\">\n  <img src=\"assets/5.png\" style=\"position: fixed;left: 0px;top:0px;z-index: 30; top: 18px;width: auto;height: 49px;border-radius: 100px;padding-left:16px;\"/>\n  <ion-icon name=\"person-circle-outline\" style=\"color:white\" id=\"Image\"></ion-icon>\n  <!-- <ion-item style=\"background-color: white; border-radius: 50px;\">\n    <ion-icon name=\"person-add-outline\" slot=\"start\" style=\"margin: 10px;\"></ion-icon>    \n    <ion-select placeholder=\"Please select\" [(ngModel)]=\"user1.selected_value\">\n      <ion-select-option value=\"Admin\">Admin</ion-select-option>\n      <ion-select-option value=\"Party\">Party</ion-select-option>\n      <ion-select-option value=\"LoksabhaMP\">LoksabhaMP</ion-select-option>\n      <ion-select-option value=\"RajyasabhaMP\">RajyasabhaMP</ion-select-option>\n      <ion-select-option value=\"MLA\">MLA</ion-select-option>\n      <ion-select-option value=\"MLC\">MLC</ion-select-option>\n    </ion-select>\n  </ion-item>  -->\n  <br/>\n  <ion-item style=\"border-radius: 50px;\">\n    <ion-icon name=\"person-outline\"  slot=\"start\" style=\"margin: 8px;\"></ion-icon>\n    <ion-input style=\"background: white;height: 51px;\" [(ngModel)]=\"user1.username\"  type=\"text\" placeholder=\"Enter your username\" required></ion-input> <br/>\n</ion-item><br/>\n<ion-item style=\"border-radius: 50px;\">\n  <ion-icon name=\"lock-open-outline\" slot=\"start\" style=\"margin: 8px;\"></ion-icon>\n\n      <ion-input  style=\"background: white;height: 51px;\" [(ngModel)]=\"user1.password\" [type]=\"isTextFieldType ? 'text' : 'password'\"   placeholder=\"Enter your password\">\n      </ion-input>\n\n        <ion-icon\n          [name]=\"isTextFieldType ? 'eye-off' : 'eye'\" (click)=\"togglePasswordFieldType()\"\n        >\n    </ion-icon>\n</ion-item><br/>\n<div style=\"text-align: center;\"><ion-button color=\"success\" (click)=\"save(user1)\">Sign In </ion-button></div><br/>\n<ion-grid>\n  <ion-row>\n    <!-- <ion-col>\n      <div style=\"text-align: center;color: white;\" (click)=\"navCtrl.navigateForward('/user')\" >\n        Registration <br/> <span style=\"font-size: 12px;\">రిజిస్ట్రేషన్లు</span>\n      </div>\n    </ion-col> -->\n    <ion-col>\n      <div style=\"text-align: center;color: white;\" (click)=\"forgot()\">\n        Forgot Password<br/>\n      </div>\n    </ion-col>\n    <!-- <ion-col>\n      <div style=\"text-align: center;color: white;\" (click)=\"btnclick()\">\n        Change Password<br/>\n      </div>\n    </ion-col> -->\n\n  </ion-row>\n</ion-grid>\n</ion-content>\n";
