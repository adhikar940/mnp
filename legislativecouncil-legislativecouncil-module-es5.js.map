export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>legislativecouncil</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n<br>\n<br>\n<ion-item>\n      <ion-label><b><h1 style=\"color:blue; font-size:30px\"><b><center>Legistlative Council Candidates</center></b></h1></b></ion-label>\n</ion-item>\n  <ion-item>\n    <ion-label style=\"color:Maroon\"><b>State</b></ion-label>\n\n    <ion-select [interfaceOptions]=\"customPopoverOptions\" interface=\"popover\" placeholder=\"Select One\"  [(ngModel)]=\"state\">\n  <div *ngFor=\"let item of items\">\n    <div  *ngIf=\"(item.State_name) === 'Andhra Pradesh'||(item.State_name) === 'Uttar Pradesh'||(item.State_name)=='Telangana'||(item.State_name)=='Bihar'||(item.State_name)=='Maharashtra'||(item.State_name)=='Karnataka'\">\n      <ion-select-option value={{item.id}}>{{ item.State_name }}</ion-select-option> </div>\n</div>\n    </ion-select>\n</ion-item>\n<ion-button color=\"medium\" (click)=\"btnClicked()\" >Submit</ion-button>\n<ion-grid class=\"padding\">\n<ion-row *ngIf=\"index\">\n  <ion-col size=\"3.5\"><b style=\"color:Olive; font-size:20px\">Photo</b></ion-col>\n  <ion-col size=\"2.5\"><b style=\"color:Olive; font-size:20px\">MLA Name</b></ion-col>\n  <ion-col size=\"2.5\"><b style=\"color:Olive; font-size:20px\">Party</b></ion-col>\n  <ion-col size=\"3.5\"><b style=\"color:Olive; font-size:20px\">Elected</b></ion-col>\n</ion-row>\n<div *ngFor=\"let i of item1\">\n<ion-row >\n<ion-col  size=\"3.5\" [routerLink]=\"['/legislativecouncil1',i.id]\" ><img src=\"{{z}}{{i.photo}}\" alt=\"No Image\" width=\"130\" height=\"130\"> </ion-col>\n<ion-col  size=\"2.5\" [routerLink]=\"['/legislativecouncil1',i.id]\"><b>{{i.MLC_name}} </b></ion-col>\n<ion-col  size=\"2.5\">{{i.party}}</ion-col>\n<ion-col  size=\"3.5\">{{i.elected}}</ion-col>\n</ion-row>\n  </div>\n</ion-grid>\n<!--\n  <ion-chip>\n    <h1 style=\"color:blue; font-size:150%;  \">The states having the Legistlative councils are Andhra Pradesh, Karnataka, Telangana, Maharashtra, Bihar, and Uttar Pradesh </h1>\n\n  </ion-chip >\n  <h6 *ngFor=\"let item of council\" >\n<ion-grid  *ngIf=\"(item.State_name) === 'Andhra Pradesh'||(item.State_name) === 'Uttar Pradesh'||(item.State_name)=='Telangana'||(item.State_name)=='Bihar'||(item.State_name)=='Maharashtra'||(item.State_name)=='Karnataka'\">\n    <h2 style=\"color:blue;text-align: center;\">{{item.State_name}}</h2>\n<br>\n<br>\n<ion-row >\n<ion-col size=\"1\"><b>Sl.no</b></ion-col>\n  <ion-col size=\"2.5\"><b>Photo</b></ion-col>\n  <ion-col size=\"2.5\"><b>MLC Name</b></ion-col>\n  <ion-col size=\"2.5\"><b>Party</b></ion-col>\n  <ion-col size=\"3.5\"><b>Elected</b></ion-col>\n</ion-row>\n<ion-row *ngFor=\"let i of item.Legislative_Council_Candidates; index as m\">\n  <ion-col  size=\"1\">{{m+1}}</ion-col>\n  <ion-col  size=\"2.5\" [routerLink]=\"['/legislativecouncil1',i.MLC_name,item.State_name,i.chldid]\"><img src=\"{{zz}}{{i.photo}}\" alt=\"No Image\" width=\"130\" height=\"130\"> </ion-col>\n  <ion-col  size=\"2.5\" [routerLink]=\"['/legislativecouncil1',i.MLC_name,item.State_name,i.chldid]\"><b>{{i.MLC_name}} </b></ion-col>\n  <ion-col  size=\"2.5\">{{i.party}}</ion-col>\n  <ion-col  size=\"3.5\">{{elected}}</ion-col>\n\n</ion-row>\n  </ion-grid>\n    </h6>\n-->\n</ion-content>\n";
