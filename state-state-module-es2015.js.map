export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>state</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h1 style=\"color:blue;text-align: center;\">States</h1>\n  <div *ngFor=\"let k of s\">\n  <ion-button  shape=\"round\"size=\"default\" expand=\"block\" fill=\"outline\"  (click)=\"Getselected(k)\">\n    {{k.State}}</ion-button></div>\n</ion-content>\n";
