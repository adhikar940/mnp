export default "<!-- <ion-header>\n  <ion-toolbar>\n    <ion-title>emailform</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2 style=\"color:blue;text-align:center;\">Please enter email here</h2>\n  <ion-item style=\"border-radius: 50px;\">\n    <ion-icon name=\"mail-outline\" style=\"color:rebeccapurple\"></ion-icon>\n\n<ion-input id=\"email\" required email placeholder=\"Enter party's mail\" type=\"text\" class=\"form-control\"\nname=\"email\" [(ngModel)] =\"email\" >\n</ion-input>\n  </ion-item> <br/>\n  \n   <div style=\"text-align: center;\"> <ion-button color=\"secondary\" (click)=\"btnclick(email)\">Activate</ion-button></div>\n  \n</ion-content> -->\n<ion-header>\n  <ion-toolbar>\n    <ion-title>confirmemail</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2 style=\"color:blue;text-align:center;\">Please Re-enter email here</h2>\n  <ion-item style=\"border-radius: 50px;\">\n    <ion-icon name=\"mail-outline\" style=\"color:rebeccapurple\"></ion-icon>\n    <ion-input id=\"email\" required email placeholder=\"Enter party's mail\" type=\"text\" class=\"form-control\" name=\"reemail\" [(ngModel)]=\"reemail\">\n    </ion-input>\n  </ion-item>\n  <br/>\n  <div style=\"text-align: center;\">\n     <ion-button color=\"secondary\" (click)=\"btnclick(reemail)\">Activate</ion-button>\n    </div>\n\n</ion-content>\n";
