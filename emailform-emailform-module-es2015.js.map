export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>emailform</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2 style=\"color:blue;text-align:center;\">Please enter email here</h2>\n  <ion-item style=\"border-radius: 50px;\">\n    <ion-icon name=\"mail-outline\" style=\"color:rebeccapurple\"></ion-icon>\n\n    <ion-input name=\"email\" id=\"email\" required email placeholder=\"Enter party's mail\" type=\"password\" class=\"form-control\"\n    name=\"email\" [(ngModel)] =\"email\" email=\"true\">\n    </ion-input >  \n\n\n\n</ion-item>\n<br/>\n<ion-item style=\"border-radius: 50px;\">\n  <ion-icon name=\"mail-outline\" style=\"color:rebeccapurple\"></ion-icon>\n<ion-input name=\"emaill\" id=\"emaill\" required email placeholder=\"Re Enter the party's mail\" type=\"email\" class=\"form-control\"\nname=\"emaill\" [(ngModel)] =\"emaill\" email=\"true\">\n</ion-input >\n</ion-item>\n   <br/>\n\n   <div style=\"text-align: center;\"> <ion-button color=\"secondary\" (click)=\"btnclick(email,emaill)\">Activate</ion-button></div>\n\n</ion-content>\n";
