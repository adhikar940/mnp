export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>Loksabha</ion-title>\n  </ion-toolbar>\n  <style>\n* {\n  box-sizing: border-box;\n}\n\n.column {\n  float: left;\n  width: 33%;\n  padding: 20px;\n}\n.c {\n  float: left;\n  width: 25%;\n  padding: 20px;\n}\n\n/* Clearfix (clear floats) */\n.row::after {\n  content: \"\";\n  clear: both;\n  display: table;\n}\nh2 {\n  text-align: center;\n}  </style>\n</ion-header>\n\n<ion-content >\n\n  <b style=\"color:blue\" > <h2>Loksabha </h2></b>\n\n  <div class=\"row\">\n    <div class=\"c\">\n    <h2 routerLink=\"/pm\" >Leader of house</h2>\n      <img routerLink=\"/pm\" src=\"assets/pm.jpg\" alt=\"Snow\" style=\"width:100%\">\n      <h2 routerLink=\"/pm\" >Narendra Modi </h2>\n    </div>\n    <div class=\"c\">\n    <h2 routerLink=\"/loksabhaspeaker\" >Speaker</h2>\n      <img routerLink=\"/loksabhaspeaker\" src=\"assets/speaker.jpg\" alt=\"Snow\" style=\"width:100%\">\n      <h2 routerLink=\"/loksabhaspeaker\">OM Birla </h2>\n    </div>\n          <div class=\"c\">\n            <h2 routerLink=\"/loksabhadeputyspeaker\">Deputy Speaker</h2>\n      <img routerLink=\"/loksabhadeputyspeaker\" src=\"assets/dp.jpg\"  style=\"width:70%\">\n      <h2 routerLink=\"/loksabhadeputyspeaker\">M Thambi Durai   </h2>\n    </div>\n    <div class=\"c\">\n      <h2>Opposition Leader</h2>\n<img src=\"assets/vacant.jpg\" style=\"width:90%;\">\n<h2>Vacant </h2>\n</div>\n  </div>\n      <app-state2></app-state2>\n  <!--\n    <ion-list *ngFor=\"let i of k1\">\n    <ion-item >\n<ion-label style=\"color:green\"><ion-button shape=\"round\" size=\"default\" expand=\"block\" fill=\"outline\" (click)=\"btnClicked('lok1',i.State_name)\">{{i.State_name}}-{{i.Loksabha_Candidates.length}}</ion-button></ion-label>\n    </ion-item>\n\n  </ion-list> -->\n\n  </ion-content >\n";
