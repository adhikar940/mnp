export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>raj1</ion-title>\n    <style>\n      * {\n  box-sizing: border-box;\n}\n\n.column {\n  float: left;\n  width: 33%;\n  padding: 20px;\n}\n.c {\n  float: left;\n  width: 25%;\n  padding: 20px;\n}\n\n/* Clearfix (clear floats) */\n.row::after {\n  content: \"\";\n  clear: both;\n  display: table;\n}\n</style>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2>Rajyasbha - {{z2}} </h2>\n<div  *ngIf=\"k\">\n  <div  *ngIf=\"z.length === 0\">\n    <h1> No Candidates to display  </h1>\n    </div>\n\n<ion-grid class=\"padding\" >\n<ion-row >\n<ion-col size=\"1\">Sl.no</ion-col>\n  <ion-col size=\"2.5\">Photo</ion-col>\n  <ion-col size=\"2.5\"><b>MPname</b></ion-col>\n  <ion-col size=\"2.5\"><b>Party</b></ion-col>\n  <ion-col size=\"3.5\"><b>Elected</b></ion-col>\n</ion-row>\n<ion-row *ngFor=\"let i of z; index as m\">\n  <ion-col  size=\"1\">{{m+1}}</ion-col>\n  <ion-col  size=\"2.5\" [routerLink]=\"['/raj2',i.id]\"><img src=\"{{zz}}{{i.photo}}\" alt=\"HTML5 Icon\" width=\"130\" height=\"130\"> </ion-col>\n  <ion-col  size=\"2.5\" [routerLink]=\"['/raj2',i.id]\"><b>{{i.MP_name}} </b></ion-col>\n  <ion-col  size=\"2.5\">{{i.Party}}</ion-col>\n  <ion-col  size=\"3.5\">{{i.elected}}</ion-col>\n</ion-row>\n</ion-grid>\n</div>\n\n</ion-content>\n";
