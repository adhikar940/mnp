export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>passwordreset</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-card style=\"border-radius: 10px;\">\n    <!-- <ion-item>\n      <label>Email</label>\n      <ion-input name=\"email\" [(ngModel)]=\"email\" >{{}}</ion-input>\n    </ion-item> -->\n    <ion-item>\n      <ion-input name=\"password\" [(ngModel)]=\"password\" [type]=\"isTextFieldType ? 'text':'password'\" #pass required placeholder=\"Please enter the new Password\"></ion-input>\n      <ion-icon slot=\"start\" style=\"color:darkorchid\" [name]=\"isTextFieldType ? 'eye-off':'eye'\" (click)=\"togglePasswordFieldType()\"></ion-icon>\n     </ion-item>\n  </ion-card>\n <div style=\"text-align: center;\" ><ion-button shape=\"round\" color=\"light\" (click) =\"btnclick(password)\">Submit</ion-button>\n </div>\n</ion-content>\n";
