export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>  Login\n</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"ion-padding ion-text-center\">\n  <div class=\"logo\">\n  <img src=\"assets/parliament2.jpg\" >\n  </div>\n  <div class=\"form\" (ngsubmit)=\"saveForm\">\n<ion-item lines='none'>\n  <ion-input [(ngModel)]='username' placeholder='Enter Email'></ion-input>\n</ion-item>\n<ion-item lines='none'>\n  <ion-input [(ngModel)]='password' placeholder='Password' type='password'></ion-input>\n</ion-item>\n<ion-button color='dark' expand='block'>Login</ion-button>\n</div>\n<ion-button fill='clear'>Forgot Password</ion-button>\n{{username}}\n{{password}}\n</ion-content>\n";
