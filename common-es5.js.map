export default "\n<ion-item >\n  <ion-list *ngFor=\"let d of items\">\n   <ion-grid class=\"padding\" *ngIf=\"d.State_name==(state)\">\n     <h1 style=\"color:green;\">&emsp;Legistlative Assembly candidates </h1>\n     <br>\n     <ion-row>\n   <ion-col size=\"1\" style=\"color:purple;\"><b>Sl.no</b></ion-col>\n       <ion-col size=\"3\"  style=\"color:purple;\"><b>District</b></ion-col>\n       <ion-col size=\"4\"  style=\"color:purple;\"><b>MLA Name</b></ion-col>\n       <ion-col size=\"4\" style=\"color:purple;\"><b>Add</b></ion-col>\n      </ion-row>\n<br>\n     <ion-row *ngFor=\"let k of (d.Assembly_Candidates); index as m\">\n       <ion-col size=\"1\" style=\"color:maroon;\">{{m+1}}</ion-col>\n       <ion-col size=\"3\" style=\"color:darkgreen;\">{{k.District}}</ion-col>\n       <ion-col size=\"4\" style=\"color:darkviolet;\">{{k.MLA_name}}</ion-col>\n       <ion-col size=\"4\" >\n         <ion-button shape=\"round\" (click)=\"btnClicked(d)\" expand=\"block\" size=\"default\" fill=\"outline\" *ngIf=\"k.actvated=='no'\" >Activate</ion-button>\n       <div *ngIf=\"k.actvated=='yes'\" style=\"color:red;\">Activated</div>\n       <div *ngIf=\"k.actvated=='process'\" >under processing</div></ion-col>\n     </ion-row>\n     </ion-grid>\n  </ion-list>\n </ion-item>\n";
