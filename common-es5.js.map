export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>state1</ion-title>\n  </ion-toolbar>\n  <style>\n    * {\n      box-sizing: border-box;\n    }\n\n    .column {\n      float: left;\n      width: 33%;\n      padding: 20px;\n    }\n    .c {\n      float: left;\n      width: 25%;\n      padding: 20px;\n    }\n\n    /* Clearfix (clear floats) */\n    .row::after {\n      content: \"\";\n      clear: both;\n      display: table;\n    }</style>\n</ion-header>\n\n<ion-content>\n  <h1 style=\"color:blue;text-align: center;\">Details</h1>\n<div class=\"row\">\n  <div class=\"column\">\n    <label><h1><u>GOVERNOR</u></h1></label>\n  <h3 >{{s.Governor}}</h3>\n  <img src=\"{{zz}}{{s.Governor_Photo}}}\" style=\"width:100%\"  >\n    <!-- {{s.Governor_Photo}} -->\n  </div>\n    <div class=\"column\">\n      <label><h1><u>CM</u></h1></label>\n    <h3>{{s.chief_minister}}</h3>\n    <img src=\"{{zz}}{{s.chief_minister_Photo}}\" style=\"width:100%\"  >\n    <!-- {{s.chief_minister_Photo}} -->\n  </div></div>\n  <ion-item >\n    <ion-icon name=\"compass\" slot=\"start\" style=\"color:darkmagenta;\"></ion-icon>\n    <ion-label><b>Capital:</b> </ion-label>\n    <ion-note slot=\"end\"><b>{{s.capital}}</b></ion-note>\n\n  </ion-item>\n</ion-content>\n";
