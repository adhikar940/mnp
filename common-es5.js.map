export default "<ion-header>\n  <ion-toolbar>\n    <ion-title style=\"color:powderblue;text-align:center;\">Collectordetails</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2> Collector Details</h2>\n    <ion-grid class=\"padding\" >\n      <ion-row>\n    <ion-col size=\"1\">Sl.no</ion-col>\n    <ion-col size=\"4\">Collector Photo</ion-col>\n        <ion-col size=\"4\">Name of the Collector</ion-col>\n        <ion-col size=\"3\">District</ion-col>\n\n      </ion-row>\n      <ion-row *ngFor=\"let c of collectordetails1.Collector_name index as m\">\n          <ion-col size=\"1\">{{m+1}}</ion-col>\n          <ion-col size=\"4\">\n            <img src=\"{{zz}}{{c.CollectorPhoto}}\" style=\"width:100%\"  >\n            <!-- <img src=\"assets/parliament2.jpg\" alt=\"Forest\" style=\"width:100%\">{{c.CollectorPhoto}} -->\n          </ion-col>\n        <ion-col size=\"4\"  ><b>{{c.Collector_name}}</b></ion-col>\n        <ion-col size=\"3\">{{c.District}}</ion-col>\n\n      </ion-row>\n    </ion-grid>\n</ion-content>\n";
