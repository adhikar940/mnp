export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>carporation1</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <h2 style=\"text-align: center;color:blue\">Corporation Districts</h2>\n  <div *ngFor=\"let na of c1\">\n   \n    <ion-button shape=\"round\" expand=\"block\" fill=\"outline\" size=\"default\" (click)=\"btnClicked(na)\">{{na.District}}  </ion-button>\n  </div>\n  <!-- <div>{{c1}}</div> -->\n</ion-content>\n";
